<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake Game</title><link rel="stylesheet" href="../style.css"><style>.game{max-width:560px;margin:40px auto;text-align:center}.game canvas{width:min(100%,480px);height:auto;background:#111827;border-radius:14px;border:4px solid #e5e7eb}.score{font-size:1.2rem;font-weight:800;margin:15px}.controls{display:grid;grid-template-columns:repeat(3,70px);justify-content:center;gap:8px;margin-top:16px}.controls button{height:55px;font-size:1.3rem;border:1px solid #cbd5e1;background:#fff;border-radius:10px}.empty{visibility:hidden}.message{min-height:28px;font-weight:700;margin:12px}</style></head><body><header><div class="wrap nav"><a class="brand" href="../">My Tools & Games</a><nav><a href="../">Home</a><a href="../solar/">Solar</a></nav></div></header><main class="wrap game"><span class="eyebrow">GAME</span><h1>🐍 Snake</h1><div class="score">Score: <span id="score">0</span></div><canvas id="c" width="480" height="480"></canvas><div id="msg" class="message">Press an arrow key to start.</div><button class="button" onclick="restart()">Restart</button><div class="controls"><button class="empty">•</button><button onclick="dir('up')">⬆️</button><button class="empty">•</button><button onclick="dir('left')">⬅️</button><button onclick="dir('down')">⬇️</button><button onclick="dir('right')">➡️</button></div><a class="back" href="../">← Back to home</a></main><script>const c=document.getElementById("c"),x=c.getContext("2d"),g=24,N=20;let s,f,dx,dy,sc,started,t;function restart(){s=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];f=food();dx=dy=0;sc=0;started=false;score.textContent=0;msg.textContent="Press an arrow key to start.";clearInterval(t);t=setInterval(tick,100);draw()}function food(){let q;do q={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};while(s&&s.some(a=>a.x===q.x&&a.y===q.y));return q}function dir(d){if(d==="up"&&dy!==1)dx=0,dy=-1;if(d==="down"&&dy!==-1)dx=0,dy=1;if(d==="left"&&dx!==1)dx=-1,dy=0;if(d==="right"&&dx!==-1)dx=1,dy=0;started=true;msg.textContent=""}function tick(){if(!started)return;let h={x:s[0].x+dx,y:s[0].y+dy};if(h.x<0||h.x>=N||h.y<0||h.y>=N||s.some(a=>a.x===h.x&&a.y===h.y)){started=false;clearInterval(t);msg.textContent="Game over! Press Restart.";return}s.unshift(h);if(h.x===f.x&&h.y===f.y){sc++;score.textContent=sc;f=food()}else s.pop();draw()}function draw(){x.fillStyle="#111827";x.fillRect(0,0,c.width,c.height);x.fillStyle="#ef4444";x.fillRect(f.x*g+3,f.y*g+3,g-6,g-6);s.forEach((a,i)=>{x.fillStyle=i?"#86efac":"#22c55e";x.fillRect(a.x*g+2,a.y*g+2,g-4,g-4)})}document.addEventListener("keydown",e=>{let m={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};if(m[e.key]){e.preventDefault();dir(m[e.key])}});restart();</script></body></html>
