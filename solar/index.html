<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solar Calculator</title><link rel="stylesheet" href="../style.css"><style>.box{max-width:760px;margin:40px auto;background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:28px;box-shadow:0 10px 30px rgba(16,24,40,.08)}label{display:block;font-weight:700;margin:18px 0 7px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:1rem}.result{margin-top:22px;padding:20px;border-radius:14px;background:#eef4ff}.back{display:inline-block;margin-top:25px;color:#2563eb;font-weight:700}</style></head><body><header><div class="wrap nav"><a class="brand" href="../">My Tools & Games</a><nav><a href="../">Home</a><a href="../snake/">Snake</a></nav></div></header><main class="wrap box"><span class="eyebrow">SOLAR TOOL</span><h1>☀️ Solar Calculator</h1><p>This is a starter calculator. Replace this file with your own Solar Calculator HTML later.</p><label>Daily electricity use (kWh)</label><input id="daily" type="number" value="20" min="0" step=".1"><label>Usable sun hours per day</label><input id="sun" type="number" value="4.5" min="1" step=".1"><label>System/loss allowance (%)</label><input id="loss" type="number" value="20" min="0" max="60"><button class="button" style="margin-top:22px;border:0;cursor:pointer" onclick="calc()">Calculate</button><div id="result" class="result">Enter your numbers and click Calculate.</div><a class="back" href="../">← Back to home</a></main><script>function calc(){let d=+daily.value,s=+sun.value,l=+loss.value/100;if(!d||!s){result.textContent="Please enter valid numbers.";return}let kw=d/(s*(1-l));result.innerHTML="Estimated solar array size: <strong>"+kw.toFixed(2)+" kW</strong><br><small>Simple estimate only — not a final engineering design.</small>}</script></body></html>
